<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
#escena{width:1400px;height:1100px;position:relative;display:flex;align-items:flex-end;justify-content:center;gap:40px;padding-bottom:60px;box-sizing:border-box}
.frasco{position:relative;display:flex;flex-direction:column;align-items:center}
.tapa{position:relative;border-radius:10px 10px 4px 4px;background:linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.9) 22%,rgba(220,225,230,.35) 45%,rgba(255,255,255,.15) 70%,rgba(255,255,255,.7) 88%,rgba(200,205,210,.4));border:2px solid rgba(160,165,170,.55);box-shadow:inset 0 0 18px rgba(255,255,255,.6)}
.atom{position:absolute;left:50%;transform:translateX(-50%);bottom:0;border-radius:6px 6px 0 0;background:linear-gradient(90deg,#1a1a1a,#4a4a4a 30%,#111 60%,#333)}
.cuello{background:linear-gradient(90deg,#8d8f93,#f2f3f5 25%,#a9abaf 50%,#e7e8ea 75%,#7f8185);border-radius:3px}
.cuerpo{position:relative;overflow:hidden;border-radius:14px 14px 28px 28px;background:linear-gradient(90deg,rgba(255,255,255,.25),rgba(255,255,255,.05) 40%,rgba(255,255,255,.2));border:2px solid rgba(170,175,180,.6);box-shadow:inset 0 0 22px rgba(255,255,255,.7),0 30px 40px -25px rgba(0,0,0,.35)}
.liquido{position:absolute;left:0;right:0;bottom:0;border-radius:0 0 26px 26px}
.brillo{position:absolute;top:4%;bottom:6%;left:12%;width:13%;border-radius:20px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0))}
.brillo2{position:absolute;top:6%;bottom:8%;right:9%;width:5%;border-radius:20px;background:rgba(255,255,255,.5)}
.etiqueta{position:absolute;left:50%;transform:translateX(-50%);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.15);border-radius:4px}
.etiqueta img{display:block}
.ml{font-family:'Poppins',Arial,sans-serif;font-weight:600;color:#161616;letter-spacing:2px}
.sombra{position:absolute;bottom:-14px;left:8%;right:8%;height:26px;border-radius:50%;background:rgba(0,0,0,.28);filter:blur(12px);z-index:-1}
</style></head><body><div id="escena"></div>
<script>
const esc=document.getElementById('escena');
function frasco(alto,ancho,color1,color2,ml,z){
 const f=document.createElement('div');f.className='frasco';f.style.zIndex=z;
 const tapaH=alto*0.20, cuelloH=alto*0.035, cuerpoH=alto-tapaH-cuelloH;
 f.innerHTML=`
 <div class="tapa" style="width:${ancho*0.62}px;height:${tapaH}px"><div class="atom" style="width:${ancho*0.30}px;height:${tapaH*0.55}px"></div></div>
 <div class="cuello" style="width:${ancho*0.78}px;height:${cuelloH}px"></div>
 <div class="cuerpo" style="width:${ancho}px;height:${cuerpoH}px">
   <div class="liquido" style="height:86%;background:linear-gradient(90deg,${color2},${color1} 30%,${color1} 65%,${color2})"></div>
   <div class="etiqueta" style="top:${cuerpoH*0.30}px;width:${ancho*0.80}px;height:${cuerpoH*0.40}px;gap:${cuerpoH*0.03}px">
     <img src="../../comercial-fragancias/public/marca/logo-negro.png" style="width:${ancho*0.62}px">
     <div class="ml" style="font-size:${ancho*0.13}px">${ml}</div>
   </div>
   <div class="brillo"></div><div class="brillo2"></div>
 </div><div class="sombra"></div>`;
 esc.appendChild(f);
}
frasco(560,170,'rgba(244,196,170,.85)','rgba(222,160,140,.95)','5 ML',1);
frasco(800,230,'rgba(240,214,150,.85)','rgba(214,176,102,.95)','10 ML',2);
frasco(560,170,'rgba(236,180,196,.85)','rgba(214,140,165,.95)','5 ML',1);
</script></body></html>
